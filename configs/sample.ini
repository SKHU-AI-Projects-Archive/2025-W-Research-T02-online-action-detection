[COMMON]
seed = 42
work_dir = 'work_dirs'

[DATA]
dataset = 'OAD' # Supported datasets: 'OAD', 'PKUMMD'
batch_size = 32
num_workers = 4
in_channels = 3
num_classes = 10
num_frames = 16
num_nodes = 25
data_dir = '/path/to/your/OAD_dataset'

[MODEL]
model = 'GATv2' # Supported models: 'GATv2'
in_channels = 3
hidden_channels = 128
out_channels = 10
num_heads = 4
dropout = 0.5

[TRAINING]
total_epoch = 100
learning_rate = 0.001
early_stopping = True
patience = 30
balanced_sampling = false

[LOSS]
loss_fn = 'CrossEntropyLoss'
loss_kwargs = {}

[OPTIMIZER]
optimizer = 'AdamW'
optimizer_kwargs = {'weight_decay': 1e-4}

[SCHEDULER]
scheduler = 'ReduceLROnPlateau'
scheduler_kwargs = {'mode': 'min', 'factor': 0.1, 'patience': 10}

[LOGGING]
log_level = 'INFO' # Supported levels: 'DEBUG', 'INFO', 'WARNING', 'ERROR'

[EVAL]
exp_dir = ''
metrics = ['accuracy'] # Supported metrics: 'accuracy'