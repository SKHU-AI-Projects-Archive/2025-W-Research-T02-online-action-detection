[COMMON]
seed = 42
work_dir = 'work_dirs'

[DATA]
dataset = 'PKUMMD'
batch_size = 32
num_workers = 0
in_channels = 3
num_classes = 52
num_frames = 32
num_nodes = 25
data_dir = 'C:/Users/user/Desktop/PKUMMD'

[MODEL]
model = 'GATv2'
in_channels = 6
hidden_channels = 128
out_channels = 52
num_heads = 4
dropout = 0.5
num_gat_layers = 4
use_tsm = True
tsm_mode = 'uni'
tsm_fold_div = 8
tsm_dilations = (1, 2, 4, 8)
use_causal_conv = False
causal_kernel = 3
causal_dilation = 1

[TRAINING]
total_epoch = 30
learning_rate = 0.001
patience = 10
early_stopping = False

[LOSS]
loss_fn = 'CrossEntropyLoss'
loss_kwargs = {}

[OPTIMIZER]
optimizer = 'AdamW'
optimizer_kwargs = {'weight_decay': 1e-4}

[SCHEDULER]
scheduler = 'ReduceLROnPlateau'
scheduler_kwargs = {'mode': 'min', 'factor': 0.1, 'patience': 10}

[LOGGING]
log_level = 'INFO'

[EVAL]
exp_dir = 'work_dirs/PKUMMD_GATv2_20260326_160721'
metrics = ['accuracy', 'mean_class_accuracy', 'action_accuracy']